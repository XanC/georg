name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Install FFmpeg
        timeout-minutes: 8
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $apt_opts update
          sudo apt-get $apt_opts install -y --no-install-recommends ffmpeg
      - name: Test
        run: uv run pytest
      - name: SPDX headers
        run: uv run python scripts/check_spdx.py
      - name: PHP lint
        run: find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: georg-bridge PHP tests
        run: for t in wordpress/georg-bridge/tests/*-test.php; do php "$t" || exit 1; done
      - name: CloudFormation lint
        run: uvx cfn-lint deploy/aws/georg.yaml deploy/aws/cloudfront-certificate.yaml
      - name: Dependency licenses
        run: uv run --no-dev --with pip-licenses python scripts/check_licenses.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deploy/Dockerfile -t georg:ci .
      - name: Smoke test
        run: docker run --rm georg:ci georg --version
      - name: Compose file
        run: |
          mkdir -p /tmp/georg-run && touch /tmp/georg-run/georg.env
          GEORG_RUN=/tmp/georg-run COMPOSE_PROFILES=backup docker compose -f deploy/compose.yaml config --quiet
