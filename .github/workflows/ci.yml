name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: SPDX headers
        run: uv run python scripts/check_spdx.py
      - name: PHP lint
        run: find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: georg-bridge signing tests
        run: php wordpress/georg-bridge/tests/signing-test.php
      - name: Dependency licenses
        run: uv run --no-dev --with pip-licenses python scripts/check_licenses.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deploy/Dockerfile -t georg:ci .
      - name: Smoke test
        run: docker run --rm georg:ci georg --version
