name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install FFmpeg
        # Static build from GitHub releases: `apt-get install ffmpeg` depends on
        # the Ubuntu archive mirrors, whose DNS has been failing on the hosted
        # runners (the step burned ~1 h of retries before erroring).
        run: |
          url=https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz
          curl -fsSL "$url" | sudo tar -xJ -C /usr/local/bin --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          ffmpeg -version | head -1
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: SPDX headers
        run: uv run python scripts/check_spdx.py
      - name: PHP lint
        run: find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: georg-bridge PHP tests
        run: for t in wordpress/georg-bridge/tests/*-test.php; do php "$t" || exit 1; done
      - name: CloudFormation lint
        run: uvx cfn-lint deploy/aws/georg.yaml deploy/aws/cloudfront-certificate.yaml
      - name: Dependency licenses
        run: uv run --no-dev --with pip-licenses python scripts/check_licenses.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deploy/Dockerfile -t georg:ci .
      - name: Smoke test
        run: docker run --rm georg:ci georg --version
      - name: Compose file
        run: |
          mkdir -p /tmp/georg-run && touch /tmp/georg-run/georg.env
          GEORG_RUN=/tmp/georg-run COMPOSE_PROFILES=backup docker compose -f deploy/compose.yaml config --quiet
