# Throwaway WordPress + Church Content site for testing georg-bridge. See docs/wordpress-testing.md.
name: georg-wp-e2e

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 30

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${GEORG_WP_PORT:-8080}:80"
    environment: &wp-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
    volumes: &wp-volumes
      - wp:/var/www/html
      - ../../wordpress/georg-bridge:/var/www/html/wp-content/plugins/georg-bridge:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/georg-e2e.ini:ro

  cli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    user: "33:33"
    depends_on:
      - wordpress
    environment: *wp-env
    volumes: *wp-volumes

volumes:
  wp:
