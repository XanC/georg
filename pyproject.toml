[project]
name = "georg"
version = "0.0.1"
description = "Self-hosted processing of worship-service recordings into publishable sermons"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
]

[project.scripts]
georg = "georg.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pip-licenses>=5.0",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
packages = ["georg"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
