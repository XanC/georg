[project]
name = "georg"
version = "0.0.1"
description = "Self-hosted processing of worship-service recordings into publishable sermons"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "paramiko>=3.4",
    "httpx>=0.27",
    "alembic>=1.13",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
]

[project.scripts]
georg = "georg.cli:main"

[project.optional-dependencies]
classify = [
    "inaspeechsegmenter>=0.8",
]
whisper = [
    "faster-whisper>=1.1",
]
gdrive = [
    "google-auth>=2.30",
]
llm = [
    "huggingface-hub>=0.24",
    "llama-cpp-python>=0.3.9",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pip-licenses>=5.0",
    "pytest>=8.3",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "types-paramiko>=3.4",
    "types-pyyaml>=6.0",
]

[tool.uv]
# inaSpeechSegmenter requires tensorflow[and-cuda] and onnxruntime-gpu, which pull in
# proprietary NVIDIA CUDA wheels. Georg runs the classifier on CPU and never imports
# the ONNX-based VBx segmenter, so use plain TensorFlow and drop onnxruntime-gpu.
override-dependencies = [
    "tensorflow>=2.16",
    "onnxruntime-gpu; sys_platform == 'never'",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
packages = ["georg"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["inaSpeechSegmenter", "inaSpeechSegmenter.*", "faster_whisper", "faster_whisper.*", "numpy", "numpy.*", "google", "google.*", "llama_cpp", "llama_cpp.*", "huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = ["slow: needs optional heavy extras or model downloads; run with `-m slow`"]
