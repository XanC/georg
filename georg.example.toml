# Example Georg configuration. Secrets are "env:NAME" references, never literals.
instance = "stpaul"
data_dir = "/var/lib/georg"
timezone = "America/Chicago"
language = "en"

[[inputs]]
name = "drive"
type = "google_drive"
options = { folder_id = "env:GEORG_DRIVE_FOLDER_ID", credentials_file = "env:GOOGLE_APPLICATION_CREDENTIALS", folder_pattern = "SPX *" }

[processors]
classifier = { type = "ina_speech_segmenter" }
detector = { type = "heuristic" }
# Local Whisper (needs the `whisper` extra); no API key or subscription.
transcriber = { type = "faster_whisper", options = { model = "large-v3-turbo", compute_type = "int8", language = "en" } }
# Hosted alternative (lemonfox.ai or any OpenAI-compatible API):
# transcriber = { type = "openai_compatible", options = { base_url = "https://api.lemonfox.ai/v1", api_key = "env:LEMONFOX_API_KEY" } }
formatter = { type = "openai_chat", options = { model = "gpt-4o-mini", api_key = "env:OPENAI_API_KEY" } }
metadata = { type = "rules" }

# Renditions default to sermon, service_hq and service_phone.

# Needs the georg-bridge plugin (wordpress/georg-bridge). Posts are drafts unless status = "publish".
[[outputs]]
name = "website"
type = "wordpress"
renditions = ["sermon"]
transcript = true
options = { base_url = "https://www.example.org", username = "georg", app_password = "env:WP_APP_PASSWORD", filename = "stpaul_sermon_{date}_{slug}.mp3", service_time = "10:30", content_prefix = "[Machine transcription]" }

[[outputs]]
name = "phone"
type = "sftp"
renditions = ["service_phone"]
options = { host = "ssh.example.org", username = "scripts", remote_path = "/var/www/html/phone/services/{date}.mp3", key_file = "env:GEORG_SFTP_KEY_FILE" }

[[outputs]]
name = "archive"
type = "google_drive_upload"
renditions = ["service_hq"]
options = { folder_id = "env:GEORG_ARCHIVE_FOLDER_ID" }

[review]
require_approval = true
notify = ["reviewer@example.org"]
