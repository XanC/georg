# Example Georg configuration. Secrets are "env:NAME" references, never literals.
instance = "stpaul"
data_dir = "/var/lib/georg"
timezone = "America/Chicago"
language = "en"

# Oldest service date discovery picks up automatically; older folders (including ones
# archived into "Services YYYY") are ignored. Omit to discover everything;
# `georg discover --since` overrides it for one run.
[discovery]
start_date = 2026-11-01

[[inputs]]
name = "drive"
type = "google_drive"
options = { folder_id = "env:GEORG_DRIVE_FOLDER_ID", credentials_file = "env:GOOGLE_APPLICATION_CREDENTIALS", folder_pattern = "SPX *" }

[processors]
classifier = { type = "ina_speech_segmenter" }
detector = { type = "heuristic" }
# Local Whisper (needs the `whisper` extra); no API key or subscription.
# Defaults are tuned for long service recordings: `vad_filter` (default true) and
# `condition_on_previous_text` (default false) prevent the classic Whisper loop where
# one hallucinated segment ("Thank you.") repeats for the whole file over music/noise.
# Extra options: prompt (Whisper initial_prompt for names/vocabulary), hotwords,
# vad_parameters (Silero VAD tuning), hallucination_silence_threshold (needs
# word_timestamps = true), word_timestamps, beam_size, download_root, local_files_only.
transcriber = { type = "faster_whisper", options = { model = "large-v3-turbo", compute_type = "int8", language = "en" } }
# Hosted alternative (lemonfox.ai or any OpenAI-compatible API):
# transcriber = { type = "openai_compatible", options = { base_url = "https://api.lemonfox.ai/v1", api_key = "env:LEMONFOX_API_KEY" } }
# Optional second pass for the published sermon transcript. It receives the sermon
# audio with the default 2-second padding; when omitted, `transcriber` is reused.
# sermon_transcriber = { type = "faster_whisper", options = { model = "large-v3", compute_type = "int8", language = "en" } }
# sermon_transcribe_pad_ms = 2000
# Local open-weights model on the CPU (needs the `llm` extra); no API key. The GGUF model
# (~2.5 GB) is downloaded on first use; see docs/dependencies.md to pre-download it.
formatter = { type = "llama_cpp", options = { cache_dir = "/var/lib/georg/models" } }
# Hosted alternative (OpenAI or any OpenAI-compatible chat API):
# formatter = { type = "openai_chat", options = { model = "gpt-4o-mini", api_key = "env:OPENAI_API_KEY" } }
metadata = { type = "rules" }

# Renditions default to sermon, service_hq and service_phone. A built-in whole-recording
# `preview` (for the review page's player) is always made; that name is reserved.

# Needs the georg-bridge plugin (wordpress/georg-bridge) with the same key id and key in the
# site's wp-config.php (docs/wordpress.md). Posts are drafts unless status = "publish".
[[outputs]]
name = "website"
type = "wordpress"
renditions = ["sermon"]
transcript = true
options = { base_url = "https://www.example.org", key_id = "2026-11", key = "env:GEORG_WP_KEY", timezone = "America/Chicago", filename = "stpaul_sermon_{date}_{slug}.mp3", service_time = "10:30", content_prefix = "[Machine transcription]" }

[[outputs]]
name = "phone"
type = "sftp"
renditions = ["service_phone"]
options = { host = "ssh.example.org", username = "scripts", remote_path = "/var/www/html/phone/services/{date}.mp3", key_file = "env:GEORG_SFTP_KEY_FILE" }

[[outputs]]
name = "archive"
type = "google_drive_upload"
renditions = ["service_hq"]
options = { folder_id = "env:GEORG_ARCHIVE_FOLDER_ID" }

[review]
require_approval = true
# Optional metadata fields left off the review form; saving keeps their values.
# Any of: series, summary, occasion, scripture, service_time.
# hidden_fields = ["series", "summary"]
# Told when a service is ready for review and when a job fails for good.
notify = ["reviewer@example.org"]
base_url = "https://georg.example.org"
smtp = { host = "email-smtp.us-east-2.amazonaws.com", username = "env:GEORG_SMTP_USER", password = "env:GEORG_SMTP_PASSWORD", sender = "Georg <georg@example.org>" }
