# Continuous replication of Georg's SQLite database to S3 (credentials from the
# instance role). Restore: see docs/deploy-aws.md.
dbs:
  - path: /var/lib/georg/georg.sqlite3
    replicas:
      - type: s3
        bucket: ${GEORG_BACKUP_BUCKET}
        path: litestream/georg.sqlite3
        region: ${AWS_REGION}
        retention: 720h
        snapshot-interval: 24h
