# aliases (`[]` allowed). [canonical] applies to both lectionaries; [three-year] or
# [one-year] is added for the configured one. A local `[calendar] occasions` file in
# the same format is merged over this one.
# Seeded from contrib/wp-authority's LSB calendar and lectionary data and the names
# found on www.stpaulaustin.org.

